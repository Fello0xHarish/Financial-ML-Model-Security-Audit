rules:
  - id: python-hardcoded-secret
    languages:
      - python
    severity: ERROR
    message: "Possible hardcoded secret detected. Use environment variables or a secrets manager."
    patterns:
      - pattern: $KEY = $VALUE
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i).*(api[_-]?key|secret|password|token|aws_access_key).*'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '["\x27][^"\x27]{6,}["\x27]'
